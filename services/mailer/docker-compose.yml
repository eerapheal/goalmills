services:
  mailer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goalmills-mailer
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - PORT=8085
      - TZ=Africa/Lagos
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
